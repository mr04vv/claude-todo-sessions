[package]
name = "cts"
version = "0.1.0"
edition = "2021"

[dependencies]
cts-core = { path = "../core" }
rmcp = { version = "3.4", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "io-std"] }

[dev-dependencies]
tempfile = "3"
