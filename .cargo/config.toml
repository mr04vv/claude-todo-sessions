# nix's gcc on this machine cannot find libiconv; use the macOS toolchain.
[target.aarch64-apple-darwin]
linker = "/usr/bin/cc"

[env]
CC = "/usr/bin/cc"
CXX = "/usr/bin/c++"
# Chromium (CEF) takes over the process's malloc zones, and SQLite's own zone
# allocator then fails with "out of memory" on writes; use plain malloc.
LIBSQLITE3_FLAGS = "-DSQLITE_WITHOUT_ZONEMALLOC"
