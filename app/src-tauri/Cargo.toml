[package]
name = "todo-sessions-app"
default-run = "todo-sessions-app"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "todo-sessions-app"
path = "src/main.rs"

# The renderer, GPU and other processes of the in-app browser (Chromium); `scripts/bundle-cef.sh` puts it in the .app.
[[bin]]
name = "todo-sessions-helper"
path = "src/bin/helper.rs"

[dependencies]
cts-core = { path = "../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `unstable` gives `get_webview` and the main webview's `bounds` (the browser pane's placement).
tauri = { version = "2", features = ["image-png", "unstable"] }
mac-notification-sys = "0.6"
uuid = { version = "1", features = ["v4"] }
# Whether the app is in front, which the window's focus cannot tell once a browser tab has the keyboard.
# NSApplication / NSView / NSWindow: the in-app browser's Chromium view (cef_browser.rs).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication", "NSApplication", "NSEvent", "NSResponder", "NSView", "NSWindow"] }
# The in-app browser is Chromium (CEF), not the system's WebKit, whose scrolling on claude.ai jumped back.
cef = { version = "154.4", default-features = false }
# The in-app terminal pane (terminal.rs).
portable-pty = "0.9"
base64 = "0.22"
# Slack's Socket Mode: a WebSocket over rustls, checked by the system's
# verifier as ureq does.
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-platform-verifier = "0.7"
# The Keychain items for Shosai alone (logins.rs).
security-framework = "3"
