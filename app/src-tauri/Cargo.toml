[package]
name = "todo-sessions-app"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cts-core = { path = "../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `unstable` gives the child webview the in-app browser pane runs in.
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
mac-notification-sys = "0.6"
uuid = { version = "1", features = ["v4"] }
# Which webview has the keyboard (AppKit's first responder), which the window's focus cannot tell.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSView", "NSWindow"] }
# The in-app terminal pane (terminal.rs).
portable-pty = "0.9"
base64 = "0.22"
